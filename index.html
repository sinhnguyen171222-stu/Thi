<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc Thi 20/10 Vui Vẻ!</title>
<style>
  * {
    margin: 0; padding: 0; box-sizing: border-box;
  }
  body {
    background: linear-gradient(to bottom right, #ffe6f0, #fff0f5);
    overflow: hidden;
    height: 100vh;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    font-family: "Brush Script MT", cursive;
  }
  canvas {
    position: fixed;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 0;
  }
  /* --- Hình bó hoa --- */
  #flower {
    width: min(60vw, 300px); /* Tự co giãn theo màn hình, max 300px */
    height: auto;
    z-index: 2;
    animation: sway 3s ease-in-out infinite alternate;
    transform-origin: bottom center;
    filter: drop-shadow(0 0 15px rgba(255, 182, 193, 0.6));
  }
  @keyframes sway {
    0% { transform: rotate(0deg) scale(1.05); }
    50% { transform: rotate(2deg) scale(1.05); }
    100% { transform: rotate(-2deg) scale(1.05); }
  }
  /* --- Dòng chữ lời chúc --- */
  h1 {
    margin-top: 20px;
    font-size: clamp(1.5rem, 5vw, 2.5rem); /* Co giãn trên điện thoại */
    color: #d63384;
    text-shadow: 0 0 10px #fff, 0 0 20px #ffb6c1;
    z-index: 2;
    animation: glow 2s ease-in-out infinite alternate;
    text-align: center;
  }
  @keyframes glow {
    from { text-shadow: 0 0 10px #fff, 0 0 20px #ffb6c1; }
    to { text-shadow: 0 0 25px #fff, 0 0 40px #ff99cc; }
  }
</style>
</head>
<body>

<canvas id="petals"></canvas>

<img id="flower" src="hoa.png" alt="Bó hoa">
<h1> Chúc Thi 20/10 vui vẻ! </h1>

<audio id="music" autoplay loop>
  <source src="nhac.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('music');

// Tự động phát nhạc, nếu bị chặn thì chạm một lần sẽ phát
audio.play().catch(() => {
  document.body.addEventListener('click', () => {
    audio.play();
  }, { once: true });
});

// --- Hiệu ứng hoa rơi ---
const canvas = document.getElementById("petals");
const ctx = canvas.getContext("2d");
let petals = [];
const petalCount = 40;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

function random(min, max) {
  return Math.random() * (max - min) + min;
}

for (let i = 0; i < petalCount; i++) {
  petals.push({
    x: random(0, canvas.width),
    y: random(0, canvas.height),
    size: random(10, 25),
    speedY: random(1, 2),
    speedX: random(-0.5, 0.5),
    rotation: random(0, 360),
    color: `rgba(255, ${random(130,180)}, ${random(160,200)}, 0.8)`
  });
}

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rotation);
  ctx.beginPath();
  ctx.ellipse(0, 0, p.size, p.size * 0.6, Math.PI / 4, 0, 2 * Math.PI);
  ctx.fillStyle = p.color;
  ctx.fill();
  ctx.restore();
}

function update() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  petals.forEach(p => {
    p.y += p.speedY;
    p.x += p.speedX;
    p.rotation += 0.02;
    if (p.y > canvas.height) {
      p.y = -10;
      p.x = random(0, canvas.width);
    }
    drawPetal(p);
  });
  requestAnimationFrame(update);
}
update();
</script>

</body>
</html>
