<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chúc mừng 20/10</title>
<style>
  body {
    margin: 0;
    overflow: hidden;
    height: 100vh;
    background: linear-gradient(to bottom right, #ffe6f0, #fff0f5);
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    align-items: center;
    text-align: center;
  }
  canvas {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
  }
  #flower {
    position: relative;
    z-index: 2;
    transform: scale(1.5);
    animation: sway 3s ease-in-out infinite alternate;
  }
  @keyframes sway {
    0% { transform: translateY(0) rotate(0deg) scale(1.5); }
    100% { transform: translateY(-5px) rotate(2deg) scale(1.5); }
  }
  h1 {
    position: relative;
    z-index: 2;
    color: #d63384;
    font-size: 2rem;
    margin-bottom: 50px;
    font-family: "Brush Script MT", cursive;
    text-shadow: 2px 2px 6px rgba(255, 192, 203, 0.7);
  }
</style>
</head>
<body>

<canvas id="petals"></canvas>
<img id="flower" src="hoa.png" alt="Bó hoa" />
<h1>💐 Chúc Thi 20/10 vui vẻ! 💕</h1>

<audio id="music" autoplay loop>
  <source src="nhac.mp3" type="audio/mpeg">
</audio>

<script>
const audio = document.getElementById('music');
// Tự động phát nhạc, nếu bị chặn thì chạm 1 lần là chạy
document.body.addEventListener('click', () => {
  if (audio.paused) audio.play();
});

// Hiệu ứng hoa rơi
const canvas = document.getElementById("petals");
const ctx = canvas.getContext("2d");
let petals = [];
const petalCount = 35;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener("resize", resizeCanvas);
resizeCanvas();

for (let i = 0; i < petalCount; i++) {
  petals.push({
    x: Math.random() * canvas.width,
    y: Math.random() * canvas.height,
    r: Math.random() * 5 + 2,
    d: Math.random() * 2 + 1
  });
}

function drawPetals() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = "rgba(255, 182, 193, 0.8)";
  ctx.beginPath();
  for (let i = 0; i < petalCount; i++) {
    const p = petals[i];
    ctx.moveTo(p.x, p.y);
    ctx.ellipse(p.x, p.y, p.r, p.r * 1.5, Math.PI / 4, 0, 2 * Math.PI);
  }
  ctx.fill();
  updatePetals();
}

let angle = 0;
function updatePetals() {
  angle += 0.01;
  for (let i = 0; i < petalCount; i++) {
    const p = petals[i];
    p.y += Math.cos(angle + p.d) + p.r / 2;
    p.x += Math.sin(angle) * 2;
    if (p.y > canvas.height) {
      petals[i] = { x: Math.random() * canvas.width, y: 0, r: p.r, d: p.d };
    }
  }
}

setInterval(drawPetals, 30);
</script>

</body>
</html>
