<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bó hoa và nhạc</title>

  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: linear-gradient(to bottom, #ffe6f0, #ffffff);
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      position: relative;
      touch-action: manipulation;
    }

    img {
      width: 45vw;
      max-width: 300px;
      height: auto;
      animation: sway 3s ease-in-out infinite alternate;
      z-index: 2;
      user-select: none;
      pointer-events: none;
    }

    @keyframes sway {
      0% { transform: rotate(-2deg); }
      100% { transform: rotate(2deg); }
    }

    /* Hoa rơi */
    .petal {
      position: absolute;
      top: -10px;
      background-color: pink;
      border-radius: 50%;
      opacity: 0.8;
      animation: fall linear infinite;
      z-index: 1;
    }

    @keyframes fall {
      0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
      }
      100% {
        transform: translateY(100vh) rotate(720deg);
        opacity: 0;
      }
    }

    h3 {
      position: absolute;
      bottom: 15px;
      color: #d63384;
      font-family: 'Segoe UI', sans-serif;
      text-align: center;
      font-size: 1.1em;
      z-index: 3;
    }

    @media (max-width: 600px) {
      img {
        width: 70vw;
      }
      h3 {
        font-size: 1em;
      }
    }
  </style>
</head>
<body>

  <img src="hoa.png" alt="Bó hoa" id="hoa">

  <h3>🌸 Chạm vào màn hình để nghe nhạc 🌸</h3>

  <!-- KHÔNG có autoplay -->
  <audio id="nhac" src="nhac.mp3" preload="none"></audio>

  <script>
    // Tạo hiệu ứng hoa rơi
    function createPetal() {
      const petal = document.createElement('div');
      petal.classList.add('petal');
      petal.style.left = Math.random() * 100 + 'vw';
      petal.style.width = Math.random() * 8 + 6 + 'px';
      petal.style.height = petal.style.width;
      petal.style.animationDuration = Math.random() * 5 + 5 + 's';
      document.body.appendChild(petal);

      setTimeout(() => petal.remove(), 10000);
    }
    setInterval(createPetal, 200);

    // Chạm vào để bật/tắt nhạc
    const nhac = document.getElementById('nhac');
    let isPlaying = false;

    function toggleMusic() {
      if (!isPlaying) {
        nhac.play().catch(err => console.log("Chưa thể phát nhạc:", err));
        isPlaying = true;
      } else {
        nhac.pause();
        isPlaying = false;
      }
    }

    // Sự kiện click hoặc chạm (cho điện thoại)
    document.body.addEventListener('click', toggleMusic);
    document.body.addEventListener('touchstart', toggleMusic);
  </script>
</body>
</html>
